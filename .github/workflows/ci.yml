name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18, 20, 22]
        exclude:
          - os: windows-latest
            node-version: 22

    steps:
      - name: Checkout lo-plugins
        uses: actions/checkout@v5

      - name: Checkout lo-sdk dependency
        uses: actions/checkout@v5
        with:
          repository: ouuabb/lo-sdk
          path: _deps/lo-sdk

      - name: Move lo-sdk to sibling directory
        shell: bash
        run: |
          mv _deps/lo-sdk ../lo-sdk
          rmdir _deps

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  docs:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: rm -f package-lock.json && npm install

      - name: Build docs
        run: npm run docs:build

  # P2-1: 发布插件包（dist/）到 GitHub Pages，充当 Plugin Repository（分发平台）。
  # 仓库需在 Settings → Pages 中设置 Source 为 gh-pages 分支。
  # 发布后官方仓库地址: https://ouuabb.github.io/lo-plugins/index.json
  deploy:
    runs-on: ubuntu-latest
    needs: [test, docs]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build plugin packages
        run: npm run build

      - name: Deploy dist to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
